name: Update C2 Wednesday pitch
on:
  push:
    paths:
      - '.github/workflows/update-c2-mainpitch.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set C2 Wednesday location to Hauptplatz
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/data/teamPages.ts')
          s=p.read_text(encoding='utf-8')
          marker="{path:'jugend/u15-c2'"
          start=s.index(marker)
          end=s.index("\n{path:", start+1)
          block=s[start:end]
          old="{day:'Mittwoch',time:'19:00 – 20:30 Uhr',place:'BSV Nordstern'}"
          new="{day:'Mittwoch',time:'19:00 – 20:30 Uhr',place:'BSV Nordstern Hauptplatz'}"
          if old not in block:
              raise SystemExit('C2 Wednesday slot not found')
          block=block.replace(old,new,1)
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "C2 mittwochs auf dem Hauptplatz trainieren lassen"
          git push origin main
