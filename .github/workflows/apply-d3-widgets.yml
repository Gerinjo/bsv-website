name: Apply D3 widgets

on:
  push:
    paths:
      - '.github/workflows/apply-d3-widgets.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add D3 fussball.de widget IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/data/teamPages.ts')
          text = path.read_text(encoding='utf-8')
          old = "{path:'jugend/u13-d3',kicker:'Leistungsfußball',headline:'Wachsen.<br /><em>Schritt für Schritt.</em>',letter:'D3',opening:"
          new = "{path:'jugend/u13-d3',kicker:'Leistungsfußball',headline:'Wachsen.<br /><em>Schritt für Schritt.</em>',letter:'D3',fussballDeWidgetId:'e1533c60-6426-41ec-83fe-15675870ed93',fussballDeTableWidgetId:'ed5f5bb0-5351-4799-85df-3065627b0ae',opening:"
          if old not in text:
              raise SystemExit('D3-Konfiguration nicht gefunden oder bereits geändert')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "D3 fussball.de Widgets ergänzen"
          git push origin main
