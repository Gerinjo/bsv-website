name: Update Alte Herren Hauptplatz
on:
  push:
    paths:
      - '.github/workflows/update-ah-hauptplatz.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update team page and occupancy plan
        run: |
          python - <<'PY'
          from pathlib import Path

          team = Path('src/data/teamPages.ts')
          s = team.read_text(encoding='utf-8')
          marker = "{path:'fussball/alte-herren'"
          start = s.index(marker)
          end = s.index("\n{path:", start + 1)
          block = s[start:end]
          old = "{day:'Mittwoch',time:'19:00 Uhr',place:'BSV Nordstern Sportplatz'}"
          new = "{day:'Mittwoch',time:'19:00 Uhr',place:'BSV Nordstern Hauptplatz'}"
          if old not in block:
              raise SystemExit('Alte-Herren-Training nicht gefunden')
          block = block.replace(old, new, 1)
          team.write_text(s[:start] + block + s[end:], encoding='utf-8')

          plan = Path('src/pages/fussball/belegungsplan.astro')
          p = plan.read_text(encoding='utf-8')
          old_alloc = "'fussball/alte-herren': { pitch: 'Nebenplatz', share: .5, shareLabel: '½ Platz', tone: 'active' }"
          new_alloc = "'fussball/alte-herren': { pitch: 'Hauptplatz', share: .5, shareLabel: '½ Platz', tone: 'active' }"
          if old_alloc not in p:
              raise SystemExit('Alte-Herren-Platzzuordnung nicht gefunden')
          plan.write_text(p.replace(old_alloc, new_alloc, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts src/pages/fussball/belegungsplan.astro
          git commit -m "Alte Herren auf den Hauptplatz verschieben"
          git push origin main
