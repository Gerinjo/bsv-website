name: Apply membership team selection

on:
  push:
    branches:
      - agent/membership-checkbox-summary

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/membership-checkbox-summary

      - name: Apply team selection changes
        run: python scripts/apply-membership-team-selection.py

      - name: Validate PHP syntax
        run: php -l public/api/membership-v3.php

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/api/membership-v3.php src/pages/verein/mitglied-werden.astro
          git commit -m "Add team selection to membership application" || exit 0
          git push
