name: Update Herren 2 training
on:
  push:
    paths:
      - '.github/workflows/update-herren2-training.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Tuesday training location
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/data/teamPages.ts')
          s=p.read_text(encoding='utf-8')
          marker="{path:'fussball/herren/kreisliga-2'"
          start=s.index(marker)
          end=s.index("\n{path:", start+1)
          block=s[start:end]
          old="{day:'Dienstag',time:'19:00 – 20:30 Uhr',place:'BSV Nordstern Radolfzell'}"
          new="{day:'Dienstag',time:'19:00 – 20:30 Uhr',place:'SV Markelfingen'}"
          if old not in block:
              raise SystemExit('Herren-2-Dienstag beim BSV nicht gefunden')
          block=block.replace(old,new,1)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "Herren 2 dienstags nach Markelfingen verlegen"
          git push origin main
