name: Generate transparent person images

on:
  # Check every morning and also react immediately to new source photos.
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/images/verein/personen/*.jpg'
      - 'public/images/verein/personen/*.jpeg'
      - 'scripts/generate-transparent-person-images.py'
      - 'scripts/requirements-transparent-person-images.txt'
      - '.github/workflows/generate-transparent-person-images.yml'

permissions:
  contents: write

concurrency:
  group: transparent-person-images
  cancel-in-progress: false

jobs:
  generate:
    name: Generate missing cutouts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-transparent-person-images.txt

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use-v1

      - name: Install background-removal tool
        run: python -m pip install -r scripts/requirements-transparent-person-images.txt

      - name: Generate new and changed cutouts
        run: python scripts/generate-transparent-person-images.py

      - name: Commit generated cutouts
        run: |
          if [ -z "$(git status --porcelain -- public/images/verein/personen/transparent)" ]; then
            echo "All transparent person images are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/verein/personen/transparent
          git commit -m "Generate transparent person images"
          git pull --rebase origin main
          git push origin HEAD:main
