name: Apply C-Juniorinnen widgets

on:
  push:
    paths:
      - '.github/workflows/apply-c-juniorinnen-widgets.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add C-Juniorinnen fussball.de widget IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/data/teamPages.ts')
          text = path.read_text(encoding='utf-8')
          old = "{path:'jugend/juniorinnen/u15',kicker:'C-Juniorinnen',headline:'Lernen.<br /><em>Wachsen.</em>',letter:'C',opening:"
          new = "{path:'jugend/juniorinnen/u15',kicker:'C-Juniorinnen',headline:'Lernen.<br /><em>Wachsen.</em>',letter:'C',fussballDeWidgetId:'46b5ce41-4781-47a4-9584-bb5dc5062e54',fussballDeTableWidgetId:'1a8c087a-bf6b-46c0-b9b9-9a9f70cfdb81',opening:"
          if old not in text:
              raise SystemExit('C-Juniorinnen-Konfiguration nicht gefunden oder bereits geändert')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "C-Juniorinnen fussball.de Widgets ergänzen"
          git push origin main
