name: Apply D2 widgets

on:
  push:
    paths:
      - '.github/workflows/apply-d2-widgets.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add D2 fussball.de widget IDs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/data/teamPages.ts')
          text = path.read_text(encoding='utf-8')
          old = "{path:'jugend/u13-d2',kicker:'Leistungsfußball',headline:'Lernen.<br /><em>Als Mannschaft.</em>',letter:'D2',opening:"
          new = "{path:'jugend/u13-d2',kicker:'Leistungsfußball',headline:'Lernen.<br /><em>Als Mannschaft.</em>',letter:'D2',fussballDeWidgetId:'be8f058e-f417-41f1-bcd7-badf526aa5a4',fussballDeTableWidgetId:'15e738ac-315c-4d20-a7a6-792099bb9e1b',opening:"
          if old not in text:
              raise SystemExit('D2-Konfiguration nicht gefunden oder bereits geändert')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "D2 fussball.de Widgets ergänzen"
          git push origin main
