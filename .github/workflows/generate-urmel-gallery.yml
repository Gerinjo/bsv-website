name: Generate URMEL gallery images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/images/events/urmel/2026-gallery.webp'
      - '.github/workflows/generate-urmel-gallery.yml'

permissions:
  contents: write

jobs:
  split-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Split gallery sprite into individual WebP images
        shell: bash
        run: |
          set -euo pipefail
          src="public/images/events/urmel/2026-gallery.webp"
          out="public/images/events/urmel/2026"
          mkdir -p "$out"

          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:0:0"    -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/01-spielszene.webp"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:360:0"  -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/02-torschuss.webp"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:720:0"  -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/03-kleinfeld.webp"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:1080:0" -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/04-turniertag.webp"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:0:240"    -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/05-medaillen.webp"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:360:240"  -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/06-siegerehrung.webp"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:720:240"  -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/07-trainerteam.webp"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "crop=360:240:1080:240" -frames:v 1 -c:v libwebp -compression_level 6 -q:v 72 "$out/08-gruppenfoto.webp"

      - name: Commit generated images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/events/urmel/2026/*.webp
          if git diff --cached --quiet; then
            echo "Gallery images are already up to date."
            exit 0
          fi
          git commit -m "Generate individual URMEL 2026 gallery images"
          git push origin HEAD:main
