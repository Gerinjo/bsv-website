name: Check MC Shape prices

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Compare official MC Shape prices
        uses: actions/github-script@v7
        with:
          script: |
            const sourceUrl = 'https://www.mcshape.com/fitnessstudio/radolfzell/';
            const expected = {
              'Classic 24 Monate': '39,90',
              'Classic 12 Monate': '49,90',
              'All-In 24 Monate': '49,90',
              'All-In 12 Monate': '59,90',
            };
            const marker = '<!-- mcshape-price-monitor -->';
            const title = '[Preischeck] MC Shape Radolfzell prüfen';

            const decode = (value) => value
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&#8364;|&euro;/gi, '€')
              .replace(/&#8211;|&ndash;/gi, '–')
              .replace(/&#8212;|&mdash;/gi, '—');

            const toText = (html) => decode(html)
              .replace(/<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();

            const extractPrice = (text, label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = text.match(new RegExp(`${escaped}[\\s\\S]{0,450}?(\\d{1,3}[,.]\\d{2})\\s*€`, 'i'));
              return match?.[1]?.replace('.', ',') ?? null;
            };

            let status = 'ok';
            let live = {};
            let errorMessage = '';

            try {
              const response = await fetch(sourceUrl, {
                headers: { 'user-agent': 'BSV-Nordstern-Price-Monitor/1.0' },
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const text = toText(await response.text());

              for (const label of Object.keys(expected)) {
                live[label] = extractPrice(text, label);
              }

              const missing = Object.entries(live).filter(([, value]) => !value);
              if (missing.length) {
                status = 'error';
                errorMessage = `Tarife konnten nicht zuverlässig ausgelesen werden: ${missing.map(([label]) => label).join(', ')}`;
              } else if (Object.entries(expected).some(([label, value]) => live[label] !== value)) {
                status = 'changed';
              }
            } catch (error) {
              status = 'error';
              errorMessage = error instanceof Error ? error.message : String(error);
            }

            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.body?.includes(marker));

            if (status === 'ok') {
              core.info('MC Shape prices still match the website baseline.');
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: 'Der automatische Preischeck ist wieder grün: Die hinterlegten Vergleichspreise stimmen mit der offiziellen MC-Shape-Seite überein.',
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              return;
            }

            const now = new Date().toISOString();
            const rows = Object.keys(expected).map((label) => {
              const current = live[label] ?? 'nicht auslesbar';
              const changed = current !== expected[label] ? '⚠️' : '✓';
              return `| ${label} | ${expected[label]} € | ${current}${current === 'nicht auslesbar' ? '' : ' €'} | ${changed} |`;
            }).join('\n');

            const body = `${marker}
## MC Shape Preischeck

**Status:** ${status === 'changed' ? 'Auf der offiziellen Seite wurden abweichende Preise gefunden.' : 'Die offizielle Preisseite konnte nicht zuverlässig geprüft werden.'}

**Quelle:** ${sourceUrl}
**Geprüft:** ${now}

| Tarif | Auf der BSV-Seite hinterlegt | Aktuell erkannt | Status |
| --- | ---: | ---: | :---: |
${rows}

${errorMessage ? `**Technischer Hinweis:** ${errorMessage}\n\n` : ''}Bitte die offizielle MC-Shape-Seite manuell prüfen und anschließend die Vergleichspreise auf der BSV-Seite nur bei Bedarf bewusst aktualisieren.

> Dieser Workflow ändert die Homepage **nicht automatisch**.`;

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.warning(`Existing price-check issue #${existing.number} updated.`);
            } else {
              const issue = await github.rest.issues.create({ owner, repo, title, body });
              core.warning(`Price-check issue #${issue.data.number} created.`);
            }
