name: Update D3 Friday training
on:
  push:
    paths:
      - '.github/workflows/update-d3-friday.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move D3 Thursday training to Friday parallel to D2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/data/teamPages.ts')
          s=p.read_text(encoding='utf-8')
          marker="{path:'jugend/u13-d3'"
          start=s.index(marker)
          end=s.index("\n{path:", start+1)
          block=s[start:end]
          old="{day:'Donnerstag',time:'17:00 – 18:30 Uhr',place:'BSV Nordstern'}"
          new="{day:'Freitag',time:'16:30 – 18:00 Uhr',place:'BSV Nordstern'}"
          if old not in block:
              raise SystemExit('D3 Thursday slot not found')
          block=block.replace(old,new,1)
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "D3 freitags parallel zur D2 trainieren lassen"
          git push origin main
