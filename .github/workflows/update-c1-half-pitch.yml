name: Update C1 half pitch
on:
  push:
    paths:
      - '.github/workflows/update-c1-half-pitch.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reserve half pitch for C1
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/fussball/belegungsplan.astro')
          s=p.read_text(encoding='utf-8')
          old="'jugend/u15-c1': { pitch: 'Hauptplatz', share: 1, shareLabel: 'Ganzer Platz', tone: 'youth' }"
          new="'jugend/u15-c1': { pitch: 'Hauptplatz', share: .5, shareLabel: '½ Platz', tone: 'youth' }"
          if old not in s:
              raise SystemExit('C1 allocation not found')
          s=s.replace(old,new,1)
          s=s.replace("<div><b>C1-Junioren</b><span>ganzer Platz</span></div>","<div><b>C1-Junioren</b><span>½ Platz</span></div>",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/fussball/belegungsplan.astro
          git commit -m "C1 nur halben Hauptplatz reservieren"
          git push origin main
