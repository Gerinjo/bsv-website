name: Update C1 Tuesday 18:00
on:
  push:
    paths:
      - '.github/workflows/update-c1-tuesday-1800.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set C1 Tuesday training to 18:00
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/data/teamPages.ts')
          s=p.read_text(encoding='utf-8')
          marker="{path:'jugend/u15-c1'"
          start=s.index(marker)
          end=s.index("\n{path:", start+1)
          block=s[start:end]
          old="{day:'Dienstag',time:'18:30 – 20:00 Uhr',place:'BSV Nordstern'}"
          new="{day:'Dienstag',time:'18:00 – 19:30 Uhr',place:'BSV Nordstern Hauptplatz'}"
          if old not in block:
              raise SystemExit('C1 Tuesday slot not found')
          block=block.replace(old,new,1)
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "C1 dienstags auf 18 Uhr vorziehen"
          git push origin main
