name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  # Rebuild every morning so published Google Calendar changes appear automatically.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Follow GitHub's official Pages workflow: only one deployment at a time,
# without cancelling a deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          PUBLIC_GST2027_API_URL: ${{ vars.PUBLIC_GST2027_API_URL }}
          # MC Shape uses the production BSV Website Supabase project, parallel to GST.
          # This is a public Edge Function URL; no secret is exposed to the frontend.
          PUBLIC_MCSHAPE_FORM_ENDPOINT: https://avbkhyptztqitlgqnajn.supabase.co/functions/v1/mcshape-interest
        run: |
          npx --no-install astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
          node scripts/check-built-paths.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
