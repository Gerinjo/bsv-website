name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Rebuild every morning so published Google Calendar changes appear automatically.
  schedule:
    - cron: '17 4 * * *'
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          # Recent commit SHAs are needed to clear Pages deployments that were
          # left queued by earlier cancelled workflow runs.
          fetch-depth: 30

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          PUBLIC_GST2027_API_URL: ${{ vars.PUBLIC_GST2027_API_URL }}

      - name: Clear stale Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u

          echo "Checking recent commits for stale GitHub Pages deployments..."
          mapfile -t stale_shas < <(git rev-list --max-count=25 HEAD^)

          for sha in "${stale_shas[@]}"; do
            response_file="$(mktemp)"
            http_status="$(
              curl --silent --show-error \
                --output "${response_file}" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel"
            )"

            case "${http_status}" in
              204)
                echo "Cancelled stale Pages deployment: ${sha}"
                ;;
              404)
                echo "No active Pages deployment for: ${sha}"
                ;;
              *)
                echo "::warning::Cancel request for ${sha} returned HTTP ${http_status}."
                cat "${response_file}"
                ;;
            esac

            rm -f "${response_file}"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
