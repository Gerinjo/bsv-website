name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  # Rebuild every morning so published Google Calendar changes appear automatically.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Follow GitHub's official Pages workflow: only one deployment at a time,
# without cancelling a deployment that has already started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Sync Tag des Mädchenfußballs 2025 images
        run: node scripts/sync-tdm-2025-images.mjs

      - name: Persist TDM image assets
        run: |
          if [ -z "$(git status --porcelain -- public/images/events/tdm/2025)" ]; then
            echo "TDM-Bilder sind bereits aktuell."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/images/events/tdm/2025
            git commit -m "Add TDM 2025 gallery images"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          PUBLIC_GST2027_API_URL: ${{ vars.PUBLIC_GST2027_API_URL }}
        run: |
          npx --no-install astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
          node scripts/check-built-paths.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
