name: Apply C2 widgets

on:
  push:
    paths:
      - '.github/workflows/apply-c2-widgets.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add C2 fussball.de widget IDs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/data/teamPages.ts')
          text = path.read_text(encoding='utf-8')
          old = "{path:'jugend/u15-c2',kicker:'Breitensport',headline:'Fußball.<br /><em>Für jeden.</em>',letter:'C2',opening:"
          new = "{path:'jugend/u15-c2',kicker:'Breitensport',headline:'Fußball.<br /><em>Für jeden.</em>',letter:'C2',fussballDeWidgetId:'9be73063-4394-4705-a49c-7627536742b8',fussballDeTableWidgetId:'9d9b5864-893f-4f14-baf5-478a6e61e221',opening:"
          if old not in text:
              raise SystemExit('C2-Konfiguration nicht gefunden oder bereits geändert')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "C2 fussball.de Widgets ergänzen"
          git push origin main
