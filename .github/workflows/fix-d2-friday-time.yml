name: Fix D2 Friday training time
on:
  push:
    paths:
      - '.github/workflows/fix-d2-friday-time.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct D2 Friday training time
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/data/teamPages.ts')
          s=p.read_text(encoding='utf-8')
          old="{day:'Freitag',time:'17:30 – 19:00 Uhr',place:'BSV Nordstern'}],trial:`Kinder der Jahrgänge ${youthYears.d} sind willkommen. Bitte frage vorab beim Trainerteam an.`,coaches:[{name:'Jörg Boreatti'"
          new="{day:'Freitag',time:'16:30 – 18:00 Uhr',place:'BSV Nordstern'}],trial:`Kinder der Jahrgänge ${youthYears.d} sind willkommen. Bitte frage vorab beim Trainerteam an.`,coaches:[{name:'Jörg Boreatti'"
          if old not in s: raise SystemExit('D2 Friday slot not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/teamPages.ts
          git commit -m "D2 Freitagstraining auf 16:30 Uhr korrigieren"
          git push origin main
